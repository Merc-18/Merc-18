<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="316" viewBox="0 0 1280 316" role="img" aria-labelledby="title desc">
<title id="title">MERC-18 — AI Engineering &amp; Software Development</title>
<desc id="desc">A minimalist deep navy developer banner with electric blue accents and a visual workflow from documents to AI to APIs.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060d19"/><stop offset=".55" stop-color="#0a1930"/><stop offset="1" stop-color="#06101f"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d7ff"/><stop offset=".5" stop-color="#4094ff"/><stop offset="1" stop-color="#4b5dff"/></linearGradient>
 <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3dcbff" stop-opacity=".1"/><stop offset=".6" stop-color="#43aeff" stop-opacity=".8"/><stop offset="1" stop-color="#4de6cb" stop-opacity=".38"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#1764b6" stop-opacity=".44"/><stop offset="1" stop-color="#1764b6" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#56a0ff" stroke-opacity=".065" stroke-width="1"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="2"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
